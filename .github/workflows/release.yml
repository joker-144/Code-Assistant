name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        working-directory: web
        run: npm ci

      - name: Install Python dependencies
        run: pip install .

      # ── Step 1: Build frontend (Vite) ──
      - name: Build Vite frontend
        working-directory: web
        run: npm run build

      # ── Step 2: Build Electron app ──
      - name: Build Electron
        working-directory: web
        run: npm run electron:build

      # ── Step 3: Build PyInstaller backend ──
      - name: Build PyInstaller dev-agent.exe
        run: |
          pip install pyinstaller
          pyinstaller dev-agent.spec

      # ── Step 4: Copy backend into Electron resources ──
      - name: Copy backend into Electron unpacked build
        run: |
          $unpackedDir = "dist-electron/win-unpacked"
          $backendDir = "$unpackedDir/resources/backend"
          New-Item -ItemType Directory -Force -Path $backendDir | Out-Null
          Copy-Item -Path "dist/dev-agent.exe" -Destination "$backendDir/dev-agent.exe" -Force
          Write-Output "Backend copied to $backendDir"

      # ── Step 5: Build Inno Setup installer ──
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss

      # ── Step 6: Upload artifacts ──
      - name: Upload Electron unpacked
        uses: actions/upload-artifact@v4
        with:
          name: DevAgent-win-unpacked
          path: dist-electron/win-unpacked/

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DevAgent-Installer
          path: dist-installer/*.exe

      # ── Step 7: Create GitHub Release (only when triggered by a tag) ──
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist-installer/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
