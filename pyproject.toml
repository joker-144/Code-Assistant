[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-agent"
version = "0.4.0"
description = "AI 编码智能体 — Agent + 工具集范式 (Cursor/Claude Code 风格)"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "gitpython>=3.1.0",
    "tiktoken>=0.7.0",                  # 精确 token 计数
    "sentence-transformers>=3.0.0",     # 本地 Embedding 模型
    "numpy>=1.26.0",                    # 向量运算（余弦相似度）
]

[project.scripts]
dev-agent = "dev_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]