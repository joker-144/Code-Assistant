[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-agent"
version = "0.1.0"
description = "多模型协作开发智能体 — DeepSeek-V4-Pro + Qwen-Plus"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pymilvus>=2.4.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "gitpython>=3.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
dev-agent = "dev_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]