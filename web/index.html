<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevAgent — AI 编码智能体</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --bg-card: #1e1e28;
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-muted: #55556a;
            --accent: #6366f1;
            --accent-tool: #22c55e;
            --accent-error: #ef4444;
            --border: #2a2a3a;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            height: 56px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent-tool));
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg { width: 16px; height: 16px; fill: white; }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-tool);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 60px 0 40px;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 520px;
            margin: 0 auto;
        }

        /* Messages */
        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 24px 0;
            min-height: 300px;
        }

        .message {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            max-width: 80%;
        }

        .message.assistant {
            align-self: flex-start;
            width: 100%;
        }

        .message-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
        }

        .message.user .message-bubble {
            background: var(--bg-tertiary);
            border-radius: 12px 12px 4px 12px;
        }

        .message-label {
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message.user .message-label { color: var(--text-muted); }
        .message.assistant .message-label { color: var(--accent); }

        .message-content {
            font-size: 14px;
            line-height: 1.7;
        }

        .message.user .message-content { color: var(--text-primary); }
        .message.assistant .message-content { color: var(--text-secondary); }

        .message pre {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-top: 10px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .message code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .message pre code { background: none; padding: 0; }

        /* Tool Call */
        .tool-call {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent-tool);
            border-radius: 8px;
            padding: 10px 14px;
            margin: 8px 0;
            font-size: 13px;
        }

        .tool-call-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-tool);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .tool-call-args {
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .tool-result {
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }

        .tool-result.expanded { max-height: none; }

        .tool-result-toggle {
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            margin-top: 6px;
            display: inline-block;
        }

        .tool-result-toggle:hover { color: var(--accent); }

        /* Error */
        .error-msg {
            color: var(--accent-error);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin: 8px 0;
        }

        /* Typing */
        .typing {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input */
        .input-area {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 4px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-top: 12px;
            transition: border-color 0.2s ease;
        }

        .input-area:focus-within { border-color: var(--accent); }

        .input-area textarea {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            padding: 12px 14px;
            resize: none;
            min-height: 44px;
            max-height: 160px;
            line-height: 1.5;
        }

        .input-area textarea::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover { background: #5558e3; transform: scale(1.05); }
        .send-btn:disabled { background: var(--bg-tertiary); cursor: not-allowed; transform: none; }
        .send-btn svg { width: 16px; height: 16px; fill: white; }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }

        .toolbar button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toolbar button:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 16px;
            color: var(--text-muted);
            font-size: 11px;
            border-top: 1px solid var(--border);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (max-width: 640px) {
            header { padding: 0 16px; }
            main { padding: 16px; }
            .hero { padding: 32px 0 24px; }
            .hero h1 { font-size: 26px; }
            .message.user { max-width: 90%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            DevAgent
        </div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span id="status-text">系统就绪</span>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>AI 编码智能体</h1>
            <p>描述你的需求，Agent 自主完成 — 读取文件、编辑代码、运行命令、语义搜索</p>
        </section>

        <div class="messages" id="messages">
            <div class="message assistant">
                <div class="message-bubble">
                    <div class="message-label">DevAgent</div>
                    <div class="message-content">
                        你好！我是 DevAgent，一个 AI 编码智能体。<br><br>
                        告诉我你的开发需求，我会自主完成：读取文件、编辑代码、运行命令、搜索代码库。
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <textarea id="input" placeholder="描述你的开发需求..." rows="1"></textarea>
            <button class="send-btn" id="send-btn" title="发送 (Enter 换行: Shift+Enter)">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 11 2 10l2-2-2-2 2-2-2-2-2 2-2-2v3l16 6-16 6v3l2-2-2-2 2-2-2-2z"/></svg>
            </button>
        </div>

        <div class="toolbar">
            <button onclick="clearChat()">清空对话</button>
            <button onclick="runIndex()">索引项目</button>
            <button onclick="showStats()">记忆统计</button>
        </div>
    </main>

    <footer>
        DevAgent v0.4.0 · Agent + 工具集范式 · 基于 Cursor / Claude Code
    </footer>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const statusText = document.getElementById('status-text');

        let isProcessing = false;
        let currentAssistantBubble = null;
        let currentAssistantContent = null;
        let conversationId = null;  // 对话 ID，首次对话后由服务端返回

        // 自动调整 textarea 高度
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
        });

        // Enter 发送，Shift+Enter 换行
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            // 添加用户消息
            addMessage('user', text);

            // 创建助手消息容器（流式填充）
            currentAssistantBubble = createAssistantBubble();
            currentAssistantContent = currentAssistantBubble.querySelector('.message-content');

            statusText.textContent = 'Agent 思考中...';

            try {
                await streamChat(text);
            } catch (err) {
                addError(`请求失败: ${err.message}`);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                statusText.textContent = '系统就绪';
                inputEl.focus();
            }
        }

        function streamChat(message) {
            return new Promise((resolve, reject) => {
                const body = { message };
                if (conversationId) {
                    body.conversation_id = conversationId;
                }
                const response = fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                response.then(res => {
                    if (!res.ok) {
                        reject(new Error(`HTTP ${res.status}`));
                        return;
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let textBuffer = '';

                    function read() {
                        reader.read().then(({ done, value }) => {
                            if (done) {
                                resolve();
                                return;
                            }

                            buffer += decoder.decode(value, { stream: true });

                            // 解析 SSE 事件
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || '';

                            let currentEvent = null;
                            for (const line of lines) {
                                if (line.startsWith('event: ')) {
                                    currentEvent = line.slice(7).trim();
                                } else if (line.startsWith('data: ') && currentEvent) {
                                    try {
                                        const data = JSON.parse(line.slice(6));
                                        handleEvent(currentEvent, data);
                                    } catch (e) {
                                        // 忽略解析错误
                                    }
                                    currentEvent = null;
                                }
                            }

                            read();
                        }).catch(reject);
                    }

                    read();
                }).catch(reject);
            });
        }

        function handleEvent(type, data) {
            switch (type) {
                case 'tool_start':
                    // 先 flush 文本
                    flushText();
                    addToolCall(data.tool, data.args, data.content);
                    statusText.textContent = `执行: ${data.tool}`;
                    break;

                case 'tool_result':
                    addToolResult(data.tool, data.content);
                    statusText.textContent = 'Agent 思考中...';
                    break;

                case 'text':
                    textBuffer += data.content;
                    currentAssistantContent.innerHTML = formatContent(textBuffer);
                    scrollToBottom();
                    break;

                case 'error':
                    flushText();
                    addError(data.content);
                    break;

                case 'done':
                    flushText();
                    // 保存 conversation_id 用于后续多轮对话
                    if (data.conversation_id) {
                        conversationId = data.conversation_id;
                    }
                    // 如果没有任何内容，显示占位
                    if (!textBuffer && !currentAssistantBubble.querySelector('.tool-call')) {
                        currentAssistantContent.innerHTML = '<em style="color: var(--text-muted)">（无回复）</em>';
                    }
                    resolveProcessing();
                    break;
            }
        }

        function flushText() {
            // text 已实时渲染，这里只是清理 buffer 状态
            textBuffer = '';
        }

        function resolveProcessing() {
            // 处理完成
        }

        function createAssistantBubble() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = `
                <div class="message-bubble">
                    <div class="message-label">DevAgent</div>
                    <div class="message-content"></div>
                </div>
            `;
            messagesEl.appendChild(div);
            scrollToBottom();
            return div;
        }

        function addMessage(type, content) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const label = type === 'user' ? '你' : 'DevAgent';
            div.innerHTML = `
                <div class="message-bubble">
                    <div class="message-label">${label}</div>
                    <div class="message-content">${type === 'user' ? escapeHtml(content) : formatContent(content)}</div>
                </div>
            `;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function addToolCall(tool, args, content) {
            if (!currentAssistantBubble) return;

            const argsStr = args ? JSON.stringify(args, null, 2) : '';
            const toolDiv = document.createElement('div');
            toolDiv.className = 'tool-call';
            toolDiv.innerHTML = `
                <div class="tool-call-header">
                    <span>⚙</span>
                    <span>${escapeHtml(tool)}</span>
                </div>
                <div class="tool-call-args">${escapeHtml(argsStr)}</div>
                <div class="tool-result" style="display:none;"></div>
            `;
            // 插入到 message-content 之后
            const bubble = currentAssistantBubble.querySelector('.message-bubble');
            bubble.appendChild(toolDiv);
            scrollToBottom();
        }

        function addToolResult(tool, content) {
            if (!currentAssistantBubble) return;

            const toolCalls = currentAssistantBubble.querySelectorAll('.tool-call');
            if (toolCalls.length === 0) return;

            // 填充最后一个 tool-call 的结果
            const lastToolCall = toolCalls[toolCalls.length - 1];
            const resultEl = lastToolCall.querySelector('.tool-result');

            const truncated = content.length > 2000 ? content.slice(0, 2000) + '\n... (已截断)' : content;
            resultEl.textContent = truncated;
            resultEl.style.display = 'block';

            // 添加展开/折叠
            if (content.length > 200) {
                resultEl.classList.add('collapsed');
                resultEl.style.maxHeight = '150px';
                const toggle = document.createElement('div');
                toggle.className = 'tool-result-toggle';
                toggle.textContent = '展开 ▼';
                toggle.onclick = () => {
                    if (resultEl.style.maxHeight === 'none') {
                        resultEl.style.maxHeight = '150px';
                        toggle.textContent = '展开 ▼';
                    } else {
                        resultEl.style.maxHeight = 'none';
                        toggle.textContent = '折叠 ▲';
                    }
                };
                lastToolCall.appendChild(toggle);
            }

            scrollToBottom();
        }

        function addError(content) {
            if (!currentAssistantBubble) {
                currentAssistantBubble = createAssistantBubble();
                currentAssistantContent = currentAssistantBubble.querySelector('.message-content');
            }
            const errDiv = document.createElement('div');
            errDiv.className = 'error-msg';
            errDiv.textContent = '错误: ' + content;
            currentAssistantBubble.querySelector('.message-bubble').appendChild(errDiv);
            scrollToBottom();
        }

        function formatContent(content) {
            return content
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // 工具栏功能
        function clearChat() {
            if (confirm('确定清空当前对话？')) {
                conversationId = null;  // 重置对话 ID，下次发消息会创建新对话
                messagesEl.innerHTML = `
                    <div class="message assistant">
                        <div class="message-bubble">
                            <div class="message-label">DevAgent</div>
                            <div class="message-content">对话已清空。请描述你的新需求。</div>
                        </div>
                    </div>
                `;
            }
        }

        async function runIndex() {
            if (!confirm('索引项目代码库？首次运行需下载 Embedding 模型（~100MB）。')) return;

            statusText.textContent = '索引中...';
            try {
                const res = await fetch('/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ force: false }),
                });
                const data = await res.json();
                if (data.success) {
                    alert(`索引完成！\n文件: ${data.stats.files}\n代码块: ${data.stats.chunks}\n跳过: ${data.stats.skipped}`);
                } else {
                    alert(`索引失败: ${data.error}`);
                }
            } catch (err) {
                alert(`请求失败: ${err.message}`);
            } finally {
                statusText.textContent = '系统就绪';
            }
        }

        async function showStats() {
            try {
                const res = await fetch('/memory/stats');
                const data = await res.json();
                alert(`记忆系统统计\n\n对话会话: ${data.conversations}\n消息数量: ${data.messages}\n代码块: ${data.file_chunks}\n经验教训: ${data.lessons}\n\n数据库: ${data.db_path}`);
            } catch (err) {
                alert(`请求失败: ${err.message}`);
            }
        }
    </script>
</body>
</html>
